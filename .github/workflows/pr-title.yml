name: PR title

# PRs are squash-merged, so the PR title becomes the commit message on main.
# Enforce Conventional Commits with a project scope, e.g. "feat(csa): add chat endpoint".
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            chore
            ci
            build
          scopes: |
            csa
            era
            rsm
            s2r
            repo
          requireScope: true
