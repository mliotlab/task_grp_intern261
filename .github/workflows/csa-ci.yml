name: CSA CI

on:
  pull_request:
    paths: ["customer-support-agent/**", ".github/workflows/csa-ci.yml", "ruff.toml"]
  push:
    branches: [main]
    paths: ["customer-support-agent/**", ".github/workflows/csa-ci.yml", "ruff.toml"]
  workflow_dispatch:

concurrency:
  group: csa-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: customer-support-agent

jobs:
  lint-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: customer-support-agent/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests + coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        with:
          name: csa-coverage
          path: customer-support-agent/coverage.xml

  eval:
    name: Eval harness (reduced, mock LLM)
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.11", cache: pip, cache-dependency-path: customer-support-agent/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: make eval-ci
      - uses: actions/upload-artifact@v7
        with:
          name: csa-eval-report
          path: customer-support-agent/eval/reports/

  docker:
    name: Build images & smoke test
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Build
        run: docker compose build
      - name: Smoke test (/health)
        run: |
          docker compose up -d --wait chat-api order-api
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8001/health
      - if: always()
        run: docker compose logs && docker compose down -v
