name: ERA Frontend CI

on:
  pull_request:
    paths: ["enterprise-research-agent/frontend/**", ".github/workflows/era-frontend-ci.yml"]
  push:
    branches: [main]
    paths: ["enterprise-research-agent/frontend/**", ".github/workflows/era-frontend-ci.yml"]
  workflow_dispatch:

concurrency:
  group: era-frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: enterprise-research-agent/frontend

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: enterprise-research-agent/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - name: Build Docker image
        run: docker build -t era-frontend:ci .
