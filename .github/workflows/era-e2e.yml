name: ERA E2E (Playwright)

# Enabled from Sprint 3. Runs the full stack with Docker Compose and executes Playwright tests.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 1-5"   # 02:00 Asia/Ho_Chi_Minh, weekdays

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-research-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - working-directory: enterprise-research-agent/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          E2E_BASE_URL: http://localhost:5173
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: enterprise-research-agent/e2e/playwright-report/
      - if: always()
        run: docker compose down -v
