name: RSM CI

on:
  pull_request:
    paths: ["retail-shelf-monitoring/**", ".github/workflows/rsm-ci.yml", "ruff.toml"]
  push:
    branches: [main]
    paths: ["retail-shelf-monitoring/**", ".github/workflows/rsm-ci.yml", "ruff.toml"]
  workflow_dispatch:

concurrency:
  group: rsm-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: retail-shelf-monitoring

jobs:
  lint-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: retail-shelf-monitoring/pyproject.toml
      # The heavy [ml] extra (ultralytics / torch) is NOT installed in CI:
      # post-processing and API are tested with synthetic boxes and a fake detector.
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests + coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: rsm-coverage
          path: retail-shelf-monitoring/coverage.xml

  docker:
    name: Build images & smoke test
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Build (without PyTorch/Ultralytics to keep CI fast)
        run: docker compose build
        env:
          WITH_ML: "0"
      - name: Smoke test (/health)
        env:
          WITH_ML: "0"
        run: |
          docker compose up -d --wait api
          curl -fsS http://localhost:8000/health
      - if: always()
        run: docker compose logs && docker compose down -v
