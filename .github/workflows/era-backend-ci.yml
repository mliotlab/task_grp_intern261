name: ERA Backend CI

on:
  pull_request:
    paths: ["enterprise-research-agent/backend/**", "enterprise-research-agent/docs/api/**", "enterprise-research-agent/docker-compose.yml", ".github/workflows/era-backend-ci.yml", "ruff.toml"]
  push:
    branches: [main]
    paths: ["enterprise-research-agent/backend/**", "enterprise-research-agent/docs/api/**", "enterprise-research-agent/docker-compose.yml", ".github/workflows/era-backend-ci.yml", "ruff.toml"]
  workflow_dispatch:

concurrency:
  group: era-backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: enterprise-research-agent/backend

jobs:
  lint-test:
    name: Lint, tests & OpenAPI contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: era
          POSTGRES_PASSWORD: era
          POSTGRES_DB: era_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U era" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://era:era@localhost:5432/era_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: enterprise-research-agent/backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests + coverage (unit + integration)
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: OpenAPI contract is up to date
        run: |
          python scripts/export_openapi.py --out ../docs/api/openapi.yaml
          git diff --exit-code ../docs/api/openapi.yaml || (echo "::error::docs/api/openapi.yaml is stale. Run 'make openapi' and commit." && exit 1)

  docker:
    name: Build images & smoke test
    needs: lint-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-research-agent
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose build api worker
      - name: Smoke test (/health)
        run: |
          docker compose up -d --wait postgres redis api
          curl -fsS http://localhost:8000/health
      - if: always()
        run: docker compose logs && docker compose down -v
