name: Feature / user story
description: A new capability, traced to a requirement (FR-xx / NFR-xx)
title: "[FR-xx] <short title>"
labels: ["type:feature"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options: [csa, era, rsm, s2r]
    validations: { required: true }
  - type: input
    id: requirement
    attributes:
      label: Requirement ID(s)
      placeholder: FR-04, NFR-03
    validations: { required: true }
  - type: textarea
    id: story
    attributes:
      label: User story
      placeholder: As a <persona>, I want <action> so that <benefit>.
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria (Given / When / Then)
      placeholder: |
        - Given ..., when ..., then ...
    validations: { required: true }
  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options: [Must, Should, Could]
  - type: input
    id: estimate
    attributes:
      label: Estimate (hours)
