name: Task
description: Engineering, docs or research task that is not a user-facing feature
title: "[Task] <short title>"
labels: ["type:chore"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options: [csa, era, rsm, s2r, repo]
    validations: { required: true }
  - type: textarea
    id: description
    attributes:
      label: Description
    validations: { required: true }
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: "- [ ] ..."
    validations: { required: true }
  - type: input
    id: sprint
    attributes:
      label: Sprint / week
      placeholder: S1
