name: Bug report
description: Something does not work as expected
title: "[Bug] <short title>"
labels: ["type:bug"]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      options: [csa, era, rsm, s2r]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make up
        2. curl ...
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
  - type: input
    id: commit
    attributes:
      label: Commit / version
