name: customer-support-agent

services:
  chat-api:
    build: { context: ., dockerfile: services/chat_api/Dockerfile }
    env_file: .env
    environment:
      ORDER_API_URL: http://order-api:8001
    ports: ["8000:8000"]
    volumes:
      - agent-data:/app/var
    depends_on:
      order-api: { condition: service_healthy }

  order-api:
    build: { context: ., dockerfile: services/order_api/Dockerfile }
    ports: ["8001:8001"]

  chat-ui:
    build: { context: ., dockerfile: services/ui/Dockerfile }
    environment:
      CHAT_API_URL: http://chat-api:8000
    ports: ["8501:8501"]
    depends_on:
      chat-api: { condition: service_healthy }

volumes:
  agent-data:
