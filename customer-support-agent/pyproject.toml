[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.1.0"
description = "LLM customer-support agent for ShopX: RAG over policy docs, order lookup, ticketing and human handoff."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Retrieval stack (FR-02, FR-03). Kept optional so unit tests and CI stay light.
rag = ["numpy>=1.26", "sentence-transformers>=3.0", "pypdf>=4.2"]
# OpenAI-compatible client: works with the mentor-provided API and with Ollama (/v1 endpoint).
llm = ["openai>=1.40"]
ui = ["streamlit>=1.38"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["support_agent*", "services*"]

[tool.ruff]
extend = "../ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["support_agent", "services"]
omit = ["services/ui/*"]

[tool.coverage.report]
show_missing = true
