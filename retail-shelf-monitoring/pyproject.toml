[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfmon"
version = "0.1.0"
description = "Retail shelf monitoring: product detection, empty-gap detection, fill rate and out-of-stock alerts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
  "pillow>=10.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Detector runtime + training. Ultralytics is AGPL-3.0: internal educational use only (see README).
ml = [
  "ultralytics>=8.4.0",
  "torch>=2.6",
  "torchvision>=0.21",
]
dashboard = ["streamlit>=1.38", "pandas>=2.2"]
tracking = ["mlflow>=2.16"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]
load = ["locust>=2.29"]

[project.scripts]
shelfmon-batch = "shelfmon.cli:main"

[tool.setuptools.packages.find]
include = ["shelfmon*", "services*"]

[tool.ruff]
extend = "../ruff.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["shelfmon", "services"]
omit = ["services/dashboard/*"]

[tool.coverage.report]
show_missing = true
