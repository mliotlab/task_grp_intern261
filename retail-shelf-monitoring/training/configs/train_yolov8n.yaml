# Fine-tuning config, passed to ultralytics `model.train(**train)`.
run_name: yolov8n-sku-v1
base_weights: yolov8n.pt
data: training/configs/sku110k_subset.yaml
train:
  epochs: 50
  imgsz: 1024
  batch: 8
  seed: 2026
  deterministic: true
  patience: 10
  max_det: 400        # SKU-110K shelves are dense (~150 products per image)
  workers: 4
  project: runs/detect
