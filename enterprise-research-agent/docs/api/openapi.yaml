openapi: 3.1.0
info:
  title: Enterprise Research Agent API
  description: Upload internal documents, run research jobs, read cited reports.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /v1/auth/register:
    post:
      tags:
      - auth
      summary: Register
      description: Create an account. The password is stored only as a bcrypt hash
        (NFR-05).
      operationId: register_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '409':
          description: Conflicts with the current state of the resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: conflict
                  message: Email already registered
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: validation_error
                  message: Request validation failed
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
                  details:
                  - loc:
                    - body
                    - email
                    msg: value is not a valid email address
                    type: value_error
  /v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      description: 'Return a JWT that expires after `JWT_EXPIRE_MINUTES`.


        Unknown email and wrong password give the same 401 (registered emails are
        not revealed).'
      operationId: login_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unauthorized
                  message: Invalid email or password
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: validation_error
                  message: Request validation failed
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
                  details:
                  - loc:
                    - body
                    - email
                    msg: value is not a valid email address
                    type: value_error
  /v1/auth/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: unauthorized
                  message: Not authenticated
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
      security:
      - HTTPBearer: []
  /v1/collections:
    get:
      tags:
      - collections
      summary: List Collections
      description: 'TODO(FR-07): only the caller''s collections.'
      operationId: list_collections_v1_collections_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size
          default: 20
          title: Limit
        description: Page size
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip
          default: 0
          title: Offset
        description: Number of items to skip
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_CollectionOut_'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Not authenticated
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Request validation failed
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
                  details:
                  - loc:
                    - body
                    - email
                    msg: value is not a valid email address
                    type: value_error
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - collections
      summary: Create Collection
      operationId: create_collection_v1_collections_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionOut'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Not authenticated
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Request validation failed
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
                  details:
                  - loc:
                    - body
                    - email
                    msg: value is not a valid email address
                    type: value_error
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/collections/{collection_id}:
    delete:
      tags:
      - collections
      summary: Delete Collection
      description: 'TODO(FR-07): return 404 (not 403) for collections owned by someone
        else.'
      operationId: delete_collection_v1_collections__collection_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Not authenticated
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Request validation failed
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
                  details:
                  - loc:
                    - body
                    - email
                    msg: value is not a valid email address
                    type: value_error
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource does not exist or belongs to another user
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Not found
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/collections/{collection_id}/documents:
    post:
      tags:
      - documents
      summary: Upload Document
      description: "TODO(FR-02, NFR-04, NFR-05):\n1. validate extension + content\
        \ type and size ≤ MAX_UPLOAD_MB (413 / 415 otherwise);\n2. compute sha256\
        \ – if the same file already exists in the collection, return it (idempotent);\n\
        3. save to storage, insert Document(status=queued),\n   enqueue `workers.ingestion.tasks.process_document`."
      operationId: upload_document_v1_collections__collection_id__documents_post
      security:
      - HTTPBearer: []
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_v1_collections__collection_id__documents_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Not authenticated
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource does not exist or belongs to another user
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Not found
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Request validation failed
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
                  details:
                  - loc:
                    - body
                    - email
                    msg: value is not a valid email address
                    type: value_error
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: File larger than MAX_UPLOAD_MB (20 MB)
          content:
            application/json:
              example:
                error:
                  code: payload_too_large
                  message: File exceeds 20 MB
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: File type is not .pdf, .docx or .md
          content:
            application/json:
              example:
                error:
                  code: unsupported_media_type
                  message: 'Unsupported file type: .xlsx'
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - documents
      summary: List Documents
      operationId: list_documents_v1_collections__collection_id__documents_get
      security:
      - HTTPBearer: []
      parameters:
      - name: collection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Collection Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Page size
          default: 20
          title: Limit
        description: Page size
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip
          default: 0
          title: Offset
        description: Number of items to skip
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_DocumentOut_'
        '401':
          description: Missing, invalid or expired token
          content:
            application/json:
              example:
                error:
                  code: unauthorized
                  message: Not authenticated
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource does not exist or belongs to another user
          content:
            application/json:
              example:
                error:
                  code: not_found
                  message: Not found
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              example:
                error:
                  code: validation_error
                  message: Request validation failed
                  request_id: 3f2b9c1e8a7d4b0c9e1f2a3b4c5d6e7f
                  details:
                  - loc:
                    - body
                    - email
                    msg: value is not a valid email address
                    type: value_error
              schema:
