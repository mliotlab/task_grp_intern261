[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "era-backend"
version = "0.1.0"
description = "Enterprise Research Agent – API service and async workers."
requires-python = ">=3.11"
license = { text = "MIT" }
# fastapi and pydantic are pinned exactly: they generate docs/api/openapi.yaml, which CI diffs
# against the committed contract. Bump them together and re-run `make openapi`.
dependencies = [
  "fastapi==0.163.2",
  "uvicorn[standard]>=0.30",
  "pydantic[email]==2.14.3",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "redis>=5.0",
  "rq>=1.16",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
ingest = ["pymupdf>=1.24",
  "python-docx>=1.1",
  "langchain-core>=0.3",
  "langchain-text-splitters>=0.3",]

# Local embedding model (pulls PyTorch, several GB). Not installed in the default image.
embeddings = [
    "sentence-transformers>=3.0",
]
llm = ["google-genai>=1.0"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]
load = ["locust>=2.29"]   # load tests (NFR-03), Sprint 3

[tool.setuptools.packages.find]
include = ["app*", "workers*"]

[tool.ruff]
extend = "../../ruff.toml"

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["N999", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "integration: needs PostgreSQL + Redis (provided by CI services or docker compose)",
  "gemini: makes real Gemini API calls",
]

[tool.coverage.run]
source = ["app", "workers"]

[tool.coverage.report]
show_missing = true
fail_under = 0   # raise to 70 by Sprint 4 (NFR-07)
