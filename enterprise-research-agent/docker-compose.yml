name: enterprise-research-agent

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://era:era@postgres:5432/era
    REDIS_URL: redis://redis:6379/0
  volumes:
    - uploads:/app/var/uploads
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: era
      POSTGRES_PASSWORD: era
      POSTGRES_DB: era
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U era"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # persist queue across restarts (NFR-04)
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *backend
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: ["rq", "worker", "ingestion", "research", "--url", "redis://redis:6379/0", "--with-scheduler"]
    healthcheck: { disable: true }

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  pgdata:
  redisdata:
  uploads:
